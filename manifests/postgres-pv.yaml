---
apiVersion: v1
kind: PersistentVolume
metadata:
  name:  postgres-pv-01
  labels: 
    app.kubernetes.io/name: postgres-pv-01
    app.kubernetes.io/instance: manual
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/data"
